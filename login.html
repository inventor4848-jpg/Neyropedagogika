<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Kirish | NeuroPed</title>
<meta name="description" content="NeuroPed elektron darsligiga kirish."/>
<script src="assets/theme-init.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="assets/style.css">
<style>
  .auth-container { max-width: 400px; margin: 120px auto; padding: 2.5rem; background: #fff; border-radius: 20px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
  .auth-title { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--primary); margin-bottom: 1.5rem; text-align: center; }
  .form-group { margin-bottom: 1.2rem; }
  .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text); margin-bottom: 0.4rem; }
  .form-group input { width: 100%; padding: 0.85rem 1rem; border: 1.5px solid var(--border); border-radius: 10px; font-family: inherit; font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
  .form-group input:focus { border-color: var(--accent); }
  .auth-btn { width: 100%; padding: 0.85rem; background: var(--primary); color: #fff; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-top: 1rem; }
  .auth-btn:hover { background: #0F2A45; transform: translateY(-2px); }
  .auth-switch { text-align: center; margin-top: 1.5rem; font-size: 0.88rem; color: var(--muted); }
  .auth-switch a { color: var(--accent); text-decoration: none; font-weight: 600; }
  #message { padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 0.85rem; display: none; }
  .msg-error { background: #FDEDEC; color: #A93226; border: 1px solid #FADBD8; }
  .msg-success { background: #EAFAF1; color: #1E8449; border: 1px solid #D4EFDF; }
</style>
</head>
<body>

<nav id="siteNav"></nav>
<div class="mobile-nav-menu" id="mobileMenu"></div>
<script src="assets/layout.js"></script>
<script>renderSiteNav('login.html');</script>

<div class="auth-container">
  <h1 class="auth-title">Xush kelibsiz</h1>
  <div id="message"></div>
  <form id="loginForm">
    <div class="form-group">
      <label>Email manzilingiz</label>
      <input type="text" id="email" required placeholder="example@mail.com yoki admin">
    </div>
    <div class="form-group">
      <label>Parol</label>
      <input type="password" id="password" required placeholder="********">
    </div>
    <button type="submit" class="auth-btn">Kirish</button>
  </form>
  <div class="auth-switch">
    Hisobingiz yoʻqmi? <a href="register.html">Roʻyxatdan oʻtish</a>
  </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const msg = document.getElementById('message');
  const submitBtn = e.target.querySelector('button[type="submit"]');

  submitBtn.disabled = true;
  submitBtn.textContent = "Tekshirilmoqda...";

  try {
    if (email === 'admin' && password === 'admin') {
      localStorage.setItem('token', 'admin-token');
      localStorage.setItem('user', JSON.stringify({ id: 0, name: 'Admin', email: 'admin' }));
      msg.textContent = "Admin panelga kirilmoqda...";
      msg.className = "msg-success";
      msg.style.display = "block";
      setTimeout(() => { window.location.href = 'admin.html'; }, 1000);
      return;
    }

    const response = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.message || "Email yoki parol notoʻg'ri");

    localStorage.setItem('token', 'local-demo-token-12345');
    localStorage.setItem('user', JSON.stringify(data.user));
    msg.textContent = "Kirish muvaffaqiyatli!";
    msg.className = "msg-success";
    msg.style.display = "block";
    setTimeout(() => {
      const urlParams = new URLSearchParams(window.location.search);
      const redirect = urlParams.get('redirect') || 'index.html';
      window.location.href = redirect;
    }, 1000);
  } catch (err) {
    console.error(err);
    msg.textContent = "Xatolik: " + err.message;
    msg.className = "msg-error";
    msg.style.display = "block";
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "Kirish";
  }
});
</script>

<footer id="siteFooter"></footer>
<script>renderSiteFooter();</script>
<script src="assets/script.js"></script>
</body>
</html>
