<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ro'yxatdan o'tish | NeuroPed</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="assets/style.css">
<style>
  .auth-container { max-width: 400px; margin: 80px auto; padding: 2.5rem; background: #fff; border-radius: 20px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
  .auth-title { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--primary); margin-bottom: 1.5rem; text-align: center; }
  .form-group { margin-bottom: 1.2rem; }
  .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text); margin-bottom: 0.4rem; }
  .form-group input { width: 100%; padding: 0.85rem 1rem; border: 1.5px solid var(--border); border-radius: 10px; font-family: inherit; font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
  .form-group input:focus { border-color: var(--accent); }
  .auth-btn { width: 100%; padding: 0.85rem; background: var(--primary); color: #fff; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-top: 1rem; }
  .auth-btn:hover { background: #0F2A45; transform: translateY(-2px); }
  .auth-switch { text-align: center; margin-top: 1.5rem; font-size: 0.88rem; color: var(--muted); }
  .auth-switch a { color: var(--accent); text-decoration: none; font-weight: 600; }
  #message { padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 0.85rem; display: none; }
  .msg-error { background: #FDEDEC; color: #A93226; border: 1px solid #FADBD8; }
  .msg-success { background: #EAFAF1; color: #1E8449; border: 1px solid #D4EFDF; }
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a class="logo" href="index.html">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2C8 2 5 5 5 9c0 2.5 1.2 4.7 3 6l1 5h6l1-5c1.8-1.3 3-3.5 3-6 0-4-3-7-7-7z"/><line x1="9" y1="17" x2="15" y2="17"/><line x1="12" y1="2" x2="12" y2="9"/></svg>
      </div>
      <div>
        <div class="logo-text">NeuroPed</div>
        <div class="logo-sub">Elektron Darslik</div>
      </div>
    </a>
  </div>
</nav>

<div class="auth-container">
  <h1 class="auth-title">Ro'yxatdan o'tish</h1>
  <div id="message"></div>
  <form id="registerForm">
    <div class="form-group">
      <label>Ism sharifingiz</label>
      <input type="text" id="name" required placeholder="Ismingiz">
    </div>
    <div class="form-group">
      <label>Email manzilingiz</label>
      <input type="email" id="email" required placeholder="example@mail.com">
    </div>
    <div class="form-group">
      <label>Parol</label>
      <input type="password" id="password" required placeholder="Kamida 6 ta belgi">
    </div>
    <button type="submit" class="auth-btn">Hisob yaratish</button>
  </form>
  <div class="auth-switch">
    Hisobingiz bormi? <a href="login.html">Kirish</a>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
<script src="assets/firebase.js"></script>
<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = document.getElementById('name').value;
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const msg = document.getElementById('message');
  const submitBtn = e.target.querySelector('button[type="submit"]');

  submitBtn.disabled = true;
  submitBtn.textContent = "Tekshirilmoqda...";

  try {
    const snapshot = await db.collection('users').where('email', '==', email).get();
    if (!snapshot.empty) {
      msg.textContent = "Bu elektron pochta allaqachon ro'yxatdan o'tgan";
      msg.className = "msg-error";
      msg.style.display = "block";
    } else {
      await db.collection('users').add({
        name,
        email,
        password,
        createdAt: new Date().toISOString()
      });
      msg.textContent = "Muvaffaqiyatli ro'yxatdan o'tdingiz!";
      msg.className = "msg-success";
      msg.style.display = "block";
      setTimeout(() => { window.location.href = 'login.html'; }, 1500);
    }
  } catch (err) {
    console.error(err);
    msg.textContent = "Xatolik: " + err.message;
    msg.className = "msg-error";
    msg.style.display = "block";
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "Hisob yaratish";
  }
});
</script>
</body>
</html>
